<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burnout Analysis Result</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #fff;
    padding: 20px;
    overflow-x: hidden;
  }

  body.light {
    background-color: #f5f5f5;
    color: #000;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    margin-bottom: 30px;
  }

  header h1 {
    font-size: 28px;
    margin: 0;
  }

  .back-btn {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #ff4757;
    color: white;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
  }

  .back-btn:hover {
    background-color: #ff6b81;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
  }

  .score-card {
    background: #1e1e1e;
    border-radius: 15px;
    padding: 30px;
    margin-bottom: 25px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }

  body.light .score-card {
    background: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  .score-circle {
    width: 200px;
    height: 200px;
    margin: 20px auto;
    position: relative;
  }

  .status-text {
    font-size: 24px;
    font-weight: bold;
    margin: 15px 0;
  }

  .status-high { color: #ff4757; }
  .status-moderate { color: #ffa502; }
  .status-low { color: #26de81; }

  .message {
    font-size: 16px;
    opacity: 0.8;
    margin-top: 10px;
  }

  .analytics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
  }

  .analytics-card {
    background: #1e1e1e;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 15px rgba(0,0,0,0.3);
  }

  body.light .analytics-card {
    background: #fff;
    box-shadow: 0 2px 15px rgba(0,0,0,0.08);
  }

  .analytics-card h3 {
    font-size: 16px;
    margin: 0 0 15px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chart-container {
    position: relative;
    height: 180px;
  }

  .recommendations {
    background: #1e1e1e;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 2px 15px rgba(0,0,0,0.3);
  }

  body.light .recommendations {
    background: #fff;
    box-shadow: 0 2px 15px rgba(0,0,0,0.08);
  }

  .recommendations h2 {
    font-size: 20px;
    margin: 0 0 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .recommendation-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px;
    margin-bottom: 10px;
    background: rgba(255, 71, 87, 0.1);
    border-radius: 8px;
    border-left: 3px solid #ff4757;
  }

  .recommendation-item i {
    color: #ff4757;
    font-size: 20px;
    margin-top: 2px;
  }

  .next-steps-btn {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #2563eb, #8b5cf6);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
  }

  .next-steps-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
  }

  .stats-bar {
    display: flex;
    justify-content: space-around;
    margin: 25px 0;
    gap: 15px;
  }

  .stat-item {
    text-align: center;
    flex: 1;
    background: rgba(255, 71, 87, 0.1);
    padding: 15px;
    border-radius: 10px;
  }

  .stat-value {
    font-size: 28px;
    font-weight: bold;
    color: #ff4757;
  }

  .stat-label {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 5px;
  }

  .loading {
    text-align: center;
    padding: 50px;
    font-size: 18px;
  }

  .pulse {
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<button class="back-btn" onclick="goBack()">
  <i class="ri-arrow-left-line"></i>
  Back to Feed
</button>

<div class="container">
  <header>
    <h1>Burnout Analysis</h1>
  </header>

  <div id="content" class="loading pulse">
    <i class="ri-loader-4-line" style="font-size: 40px;"></i>
    <p>Analyzing your interactions...</p>
  </div>
</div>

<script>
function goBack() {
  window.location.href = "/insta";
}

function goToNextSteps() {
  window.location.href = "/result";
}

// Get burnout data from localStorage
const burnoutData = localStorage.getItem("burnoutData");

if (!burnoutData) {
  document.getElementById("content").innerHTML = `
    <div style="text-align: center; padding: 50px;">
      <i class="ri-error-warning-line" style="font-size: 50px; color: #ff4757;"></i>
      <h2>No Data Available</h2>
      <p>Please complete the burnout check from the feed.</p>
    </div>
  `;
} else {
  const data = JSON.parse(burnoutData);
  renderResults(data);
}

function renderResults(data) {
  const statusClass = `status-${data.level}`;
  const statusColor = data.level === 'high' ? '#ff4757' : 
                      data.level === 'moderate' ? '#ffa502' : '#26de81';

  let html = `
    <div class="score-card">
      <div class="score-circle">
        <canvas id="scoreChart"></canvas>
      </div>
      <div class="status-text ${statusClass}">${data.status}</div>
      <div class="message">${data.message}</div>
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-value">${data.percentage}%</div>
          <div class="stat-label">Burnout Risk</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${data.interactions}</div>
          <div class="stat-label">Interactions</div>
        </div>
      </div>
    </div>

    <div class="analytics-grid">
      <div class="analytics-card">
        <h3><i class="ri-heart-pulse-line"></i> Category Analysis</h3>
        <div class="chart-container">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
      
      <div class="analytics-card">
        <h3><i class="ri-bar-chart-line"></i> Stress Factors</h3>
        <div class="chart-container">
          <canvas id="stressChart"></canvas>
        </div>
      </div>
    </div>

    <div class="recommendations">
      <h2><i class="ri-lightbulb-line"></i> Personalized Recommendations</h2>
      ${data.recommendations.map(rec => `
        <div class="recommendation-item">
          <i class="ri-check-line"></i>
          <span>${rec}</span>
        </div>
      `).join('')}
      
      <button class="next-steps-btn" onclick="goToNextSteps()">
        <i class="ri-arrow-right-line"></i>
        Go to Next Steps
      </button>
    </div>
  `;

  document.getElementById("content").innerHTML = html;

  // Create Score Chart (Doughnut)
  const scoreCtx = document.getElementById('scoreChart').getContext('2d');
  new Chart(scoreCtx, {
    type: 'doughnut',
    data: {
      datasets: [{
        data: [data.percentage, 100 - data.percentage],
        backgroundColor: [statusColor, 'rgba(255,255,255,0.1)'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      cutout: '75%',
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false }
      }
    },
    plugins: [{
      id: 'centerText',
      afterDraw: (chart) => {
        const ctx = chart.ctx;
        ctx.save();
        const centerX = chart.width / 2;
        const centerY = chart.height / 2;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 36px Arial';
        ctx.fillStyle = statusColor;
        ctx.fillText(data.percentage + '%', centerX, centerY);
        ctx.restore();
      }
    }]
  });

  // Category Chart (Radar)
  const categoryCtx = document.getElementById('categoryChart').getContext('2d');
  new Chart(categoryCtx, {
    type: 'radar',
    data: {
      labels: ['Stress', 'Rest Need', 'Work Attitude', 'Emotional'],
      datasets: [{
        label: 'Risk Level',
        data: [
          data.categories.stress,
          data.categories.rest,
          data.categories.work,
          data.categories.emotional
        ],
        backgroundColor: 'rgba(255, 71, 87, 0.2)',
        borderColor: '#ff4757',
        borderWidth: 2,
        pointBackgroundColor: '#ff4757',
        pointBorderColor: '#fff',
        pointHoverBackgroundColor: '#fff',
        pointHoverBorderColor: '#ff4757'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          beginAtZero: true,
          max: 100,
          ticks: { display: false },
          grid: { color: 'rgba(255,255,255,0.1)' },
          pointLabels: { 
            color: document.body.classList.contains('light') ? '#000' : '#fff',
            font: { size: 11 }
          }
        }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });

  // Stress Factors Chart (Bar)
  const stressCtx = document.getElementById('stressChart').getContext('2d');
  new Chart(stressCtx, {
    type: 'bar',
    data: {
      labels: ['Stress', 'Rest', 'Work', 'Emotional'],
      datasets: [{
        data: [
          data.categories.stress,
          data.categories.rest,
          data.categories.work,
          data.categories.emotional
        ],
        backgroundColor: [
          'rgba(255, 71, 87, 0.8)',
          'rgba(255, 165, 2, 0.8)',
          'rgba(38, 222, 129, 0.8)',
          'rgba(87, 101, 116, 0.8)'
        ],
        borderRadius: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        y: {
          beginAtZero: true,
          max: 100,
          ticks: { color: document.body.classList.contains('light') ? '#000' : '#fff' },
          grid: { color: 'rgba(255,255,255,0.1)' }
        },
        x: {
          ticks: { color: document.body.classList.contains('light') ? '#000' : '#fff' },
          grid: { display: false }
        }
      }
    }
  });
}
</script>

</body>
</html>
